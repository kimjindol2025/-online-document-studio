<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>자기소개서</title>
<style>
@page { size: A4; margin: 18mm; }
body { font-family: 'Malgun Gothic', sans-serif; font-size: 12px; line-height: 1.7; max-width: 210mm; margin: 0 auto; padding: 20px; }
h1 { text-align: center; letter-spacing: 8px; }
.section { margin-bottom: 18px; }
.section h3 { border-bottom: 1px solid #333; padding-bottom: 3px; margin-bottom: 8px; }
textarea { width: 100%; border: 1px solid #ccc; padding: 8px; font-family: inherit; font-size: 12px; }
</style>
</head>
<body>
<h1>자 기 소 개 서</h1>
<p style="text-align:center;">지원회사: <input style="width:200px; border-bottom:1px solid #999;"> &nbsp; 지원직무: <input style="width:150px; border-bottom:1px solid #999;"></p>
<div class="section">
<h3>1. 성장과정</h3>
<textarea rows="6">저는 ○○에서 성장하며...</textarea>
</div>
<div class="section">
<h3>2. 지원동기 및 포부</h3>
<textarea rows="6">귀사의 ○○ 직무에 지원하게 된 이유는...</textarea>
</div>
<div class="section">
<h3>3. 성격의 장단점</h3>
<textarea rows="5">장점: 책임감이 강합니다. 단점: 완벽주의 성향이 있습니다.</textarea>
</div>
<div class="section">
<h3>4. 경력 및 경험</h3>
<textarea rows="5">(주)샘플기업에서 3년간 영업 업무를 수행하며...</textarea>
</div>
<p style="text-align:right; margin-top:30px;">2026년 11월 18일<br>작성자: ____________ (인)</p>
</body>
</html>
