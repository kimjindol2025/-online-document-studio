<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>재직증명서</title>
<style>
@page { size: A4; margin: 20mm; }
body { font-family: 'Malgun Gothic', sans-serif; font-size: 13px; line-height: 1.8; max-width: 210mm; margin: 0 auto; padding: 30px; }
h1 { text-align: center; letter-spacing: 12px; margin-bottom: 30px; }
table { width: 100%; border-collapse: collapse; margin: 20px 0; }
td { border: 1px solid #333; padding: 10px; }
.label { background: #f5f5f5; width: 120px; font-weight: bold; }
input { border: none; width: 100%; font-family: inherit; font-size: 13px; }
.stamp { text-align: center; margin-top: 50px; }
</style>
</head>
<body>
<h1>재 직 증 명 서</h1>
<table>
<tr><td class="label">성명</td><td><input value="홍길동"></td></tr>
<tr><td class="label">생년월일</td><td><input type="date" value="1990-01-01"></td></tr>
<tr><td class="label">소속</td><td><input value="영업팀"></td></tr>
<tr><td class="label">직위</td><td><input value="사원"></td></tr>
<tr><td class="label">재직기간</td><td><input value="2024년 3월 1일 ~ 현재"></td></tr>
<tr><td class="label">용도</td><td><input value="금융기관 제출용"></td></tr>
</table>
<p style="text-align:center; margin: 30px 0;">위 사람은 현재 본 회사에 재직 중임을 증명합니다.</p>
<div class="stamp">
<p>2026년 11월 18일</p>
<p style="margin-top:40px;">(주)샘플기업</p>
<p>대표이사 홍길동 (인)</p>
</div>
</body>
</html>
