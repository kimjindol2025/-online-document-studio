<!DOCTYPE html>
<html lang="ko">
<head>

<title>임대차계약서</title>
<style>

table { width: 100%; border-collapse: collapse; margin: 10px 0; }
td { border: 1px solid #333; padding: 6px; }
.label { background: #f5f5f5; width: 100px; }

<body>
<h1>주 택 임 대 차 계 약 서</h1>

<tr><td class="label">보증금</td><td>금 <input value="50,000,000" style="width:120px;"> 원</td></tr>
<tr><td class="label">월세</td><td>금 <input value="500,000" style="width:100px;"> 원</td></tr>
<tr><td class="label">계약기간</td><td><input value="2026.12.01 ~ 2028.11.30"></td></tr>
</table>
<p>임대인과 임차인은 위 부동산에 대하여 임대차계약을 체결한다.</p>

</html>
