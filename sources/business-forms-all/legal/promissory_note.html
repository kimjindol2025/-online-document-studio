<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>차용증</title>
<style>
@page { size: A4; margin: 20mm; }
body { font-family: 'Malgun Gothic', sans-serif; font-size: 13px; line-height: 1.8; max-width: 210mm; margin: 0 auto; padding: 30px; }
h1 { text-align: center; letter-spacing: 10px; }
table { width: 100%; border-collapse: collapse; margin: 15px 0; }
td { border: 1px solid #333; padding: 8px; }
.label { background: #f5f5f5; width: 100px; }
input { border: none; width: 100%; font-family: inherit; font-size: 13px; }
</style>
</head>
<body>
<h1>차 용 증</h1>
<table>
<tr><td class="label">채권자</td><td>성명: <input value="김철수" style="width:140px;"> &nbsp; 연락처: <input style="width:140px;"></td></tr>
<tr><td class="label">채무자</td><td>성명: <input value="홍길동" style="width:140px;"> &nbsp; 연락처: <input style="width:140px;"></td></tr>
<tr><td class="label">차용금액</td><td>금 <input value="10,000,000" style="width:120px;"> 원정</td></tr>
<tr><td class="label">차용일</td><td><input type="date" value="2026-11-18"></td></tr>
<tr><td class="label">변제기일</td><td><input type="date" value="2027-11-18"></td></tr>
<tr><td class="label">이자</td><td>연 <input value="5" style="width:40px;"> %</td></tr>
</table>
<p>위 금액을 확실히 차용하였으며, 변제기일에 원금과 이자를 상환할 것을 약속합니다.</p>
<div style="display:flex; justify-content:space-between; margin-top:40px;">
<div>채권자: ____________ (인)</div>
<div>채무자: ____________ (인)</div>
</div>
<p style="text-align:center; margin-top:30px;">2026년 11월 18일</p>
</body>
</html>
