<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>발주서</title>
  <style>
    @page { size: A4; margin: 15mm; }
    body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; font-size: 12px; color: #222; max-width: 210mm; margin: 0 auto; padding: 20px; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 24px; margin: 0; letter-spacing: 6px; }
    .info-table, .items-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
    .info-table td, .items-table th, .items-table td { border: 1px solid #333; padding: 6px 8px; }
    .info-table .label { background: #e8f5e9; width: 100px; font-weight: bold; }
    .items-table th { background: #1b5e20; color: #fff; text-align: center; }
    .items-table td { text-align: center; }
    .items-table td.left { text-align: left; }
    .items-table td.right { text-align: right; }
    .total-row { font-weight: bold; background: #c8e6c9; }
    input, textarea { border: none; border-bottom: 1px dotted #aaa; width: 100%; font-size: 12px; font-family: inherit; }
    input:focus, textarea:focus { outline: none; background: #fffde7; }
    @media print { body { padding: 0; } input, textarea { border: none; } }
  </style>
</head>
<body>
  <div class="header">
    <h1>발 주 서</h1>
    <p>Purchase Order</p>
  </div>

  <table class="info-table">
    <tr>
      <td class="label">발주번호</td>
      <td><input type="text" value="PO-2026-001"></td>
      <td class="label">발주일자</td>
      <td><input type="date" value="2026-11-18"></td>
    </tr>
    <tr>
      <td class="label">납기요청일</td>
      <td><input type="date" value="2026-12-15"></td>
      <td class="label">관련견적</td>
      <td><input type="text" value="QT-2026-001"></td>
    </tr>
  </table>

  <table class="info-table">
    <tr>
      <td class="label">발주처 (구매자)</td>
      <td class="label">공급처 (판매자)</td>
    </tr>
    <tr>
      <td>
        상호: <input type="text" value="고객사명"><br>
        담당자: <input type="text"><br>
        전화: <input type="text"><br>
        주소: <input type="text">
      </td>
      <td>
        상호: <input type="text" value="(주)샘플기업"><br>
        담당자: <input type="text" value="홍길동"><br>
        전화: <input type="text" value="02-1234-5678"><br>
        주소: <input type="text" value="서울시 강남구 테헤란로 123">
      </td>
    </tr>
  </table>

  <table class="items-table">
    <thead>
      <tr>
        <th style="width:40px">No</th>
        <th>품명 / 규격</th>
        <th style="width:60px">수량</th>
        <th style="width:50px">단위</th>
        <th style="width:90px">단가</th>
        <th style="width:100px">금액</th>
        <th style="width:80px">납기</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>1</td>
        <td class="left"><input type="text" value="웹사이트 제작"></td>
        <td><input type="number" value="1" style="width:50px"></td>
        <td><input type="text" value="식" style="width:40px"></td>
        <td class="right"><input type="number" value="5000000" style="width:80px; text-align:right"></td>
        <td class="right">5,000,000</td>
        <td><input type="text" value="2026-12-15" style="width:70px"></td>
      </tr>
      <tr>
        <td>2</td>
        <td class="left"><input type="text" value="유지보수 (연간)"></td>
        <td><input type="number" value="1" style="width:50px"></td>
        <td><input type="text" value="식" style="width:40px"></td>
        <td class="right"><input type="number" value="1200000" style="width:80px; text-align:right"></td>
        <td class="right">1,200,000</td>
        <td><input type="text" value="2026-12-31" style="width:70px"></td>
      </tr>
      <tr>
        <td>3</td>
        <td class="left"><input type="text"></td>
        <td><input type="number" style="width:50px"></td>
        <td><input type="text" style="width:40px"></td>
        <td class="right"><input type="number" style="width:80px; text-align:right"></td>
        <td class="right"></td>
        <td><input type="text" style="width:70px"></td>
      </tr>
      <tr class="total-row">
        <td colspan="5">합 계 (VAT 별도)</td>
        <td class="right">6,200,000</td>
        <td></td>
      </tr>
    </tbody>
  </table>

  <p><strong>납품조건 / 특이사항</strong></p>
  <textarea rows="3" style="width:100%; border:1px solid #ccc; padding:8px;">납품장소: 발주처 지정 장소. 하자보증 1년. 지급조건: 계약금 50%, 완료 시 50%.</textarea>

  <div style="margin-top:30px; display:flex; justify-content:space-between;">
    <div>
      <p>발주처 확인</p>
      <p style="margin-top:40px;">담당자: ____________ (인)</p>
    </div>
    <div style="text-align:right;">
      <p>공급처 수락</p>
      <p style="margin-top:40px;">담당자: ____________ (인)</p>
    </div>
  </div>
</body>
</html>
